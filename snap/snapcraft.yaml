# Shape: kde-neon-6 on core24, Qt 6 from the kf6-core24 content snap, the
# app built with the CMake plugin, version read from the CMake project.
name: playlist-dl
adopt-info: playlist-dl
grade: stable
confinement: strict
base: core24
compression: lzo

title: Playlist-Dl
summary: YouTube Playlist Downloader
description: |
  Playlist-Dl is a powerful GUI app for Searching, Browsing, Playing and
  Downloading YouTube Playlists on Linux Desktop.
website: https://github.com/keshavbhatt/p-pldl
issues: https://github.com/keshavbhatt/p-pldl/issues
license: GPL-3.0
icon: snap/gui/icon.png

platforms:
  amd64:

apps:
  playlist-dl:
    command: usr/bin/playlist-dl
    desktop: usr/share/applications/playlist-dl.desktop
    extensions:
      - kde-neon-6
    plugs:
      - audio-playback
      - browser-support # the built-in player
      - desktop
      - desktop-legacy
      - home # download folder
      - mount-observe
      - network
      - network-status
      - opengl
      - removable-media # download to external drives
      - screen-inhibit-control
      - unity7
      - wayland
      - x11

parts:
  playlist-dl:
    plugin: cmake
    source: .
    build-snaps:
      - cmake/latest/stable
    build-packages:
      - libxkbcommon-dev
      - libdrm-dev
    stage-packages:
      - libdrm2
      - libxcb-shape0 # libqxcb needs it
      - fonts-noto-core
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
    override-build: |
      craftctl default
      # version from the CMake project
      VER=$(grep -m1 '^CMAKE_PROJECT_VERSION:STATIC=' "${CRAFT_PART_BUILD}/CMakeCache.txt" | cut -d= -f2)
      craftctl set version="${VER}"
      # store icon
      mkdir -p "${CRAFT_PART_INSTALL}/meta/gui"
      cp "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/512x512/apps/playlist-dl.png" \
         "${CRAFT_PART_INSTALL}/meta/gui/icon.png"
    prime:
      - -usr/include
      - -usr/lib/*/cmake
      - -usr/share/ECM
      - -usr/share/man
      - -usr/share/doc
      - -usr/share/lintian
